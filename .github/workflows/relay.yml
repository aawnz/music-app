name: Jam relay

# Deploys the Jam relay to Cloudflare Workers and records its address in
# jam-relay-url.txt, which the app build reads. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["jam-relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test
        working-directory: jam-relay
        run: node test.mjs
      - name: Deploy
        id: deploy
        working-directory: jam-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first."
            exit 1
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not find the relay's address in the deploy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Record the address
        run: |
          url="${{ steps.deploy.outputs.url }}"
          wss="${url/https:/wss:}"
          if [ "$(cat jam-relay-url.txt 2>/dev/null)" != "$wss" ]; then
            echo "$wss" > jam-relay-url.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add jam-relay-url.txt
            git commit -m "Jam relay at $wss"
            git push
          fi
          curl -fsS "$url/health"

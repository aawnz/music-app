# The Spotifast Jam relay: passes short "now playing" messages between the
# apps in a Jam. No audio and no Spotify credentials go through it.
name = "spotifast-jam"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "JamRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JamRoom"]
